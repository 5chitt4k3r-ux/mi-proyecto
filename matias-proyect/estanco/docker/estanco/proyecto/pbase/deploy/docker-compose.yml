name: pbase
services:
  web:
    build:
      context: ../../../
      dockerfile: ./dockerfiles/ubbase/tiamatubbase
      args:
        - INICIALES=tiamat
    container_name: cttiamatbase01
    image: kuklusklan/ubbase01
    ports:
      - 22:22
    env_file:
      - ./.env
    volumes:
      - ./logs:/root/logs
    networks:
      pbase_network:
        ipv4_address: 192.168.20.3
networks:
  pbase_network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.20.0/24