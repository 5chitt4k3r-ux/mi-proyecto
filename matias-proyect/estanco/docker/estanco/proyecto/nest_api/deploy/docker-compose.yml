services:
  web:
    build:
      context: /home/kuklusklan/proyecto_tfg/docker/megacrossover/
      dockerfile: ./dockerfiles/nginxpokeapinext/dockerfile
      args:
        - INICIALES=tiamat
    container_name: cttiamatnginxpokeapi
    image: kuklusklan/nginxpokeapi
    ports:
      - 3010:3001
    env_file:
      - ./.env
    volumes:
      - ./logs:/root/logs
    networks:
      pnautocaravaneando:
        ipv4_address: ${IP_WEB}
networks:
  pnautocaravaneando:
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET}